<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your FarmStand password</title>
<style>
  :root { --green:#2D5A1B; --cream:#FAFAF5; --border:#DDE8D0; --muted:#6B7C6B; --red:#C0392B; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--cream); padding:24px;
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:32px;
          width:100%; max-width:420px; box-shadow:0 2px 12px rgba(0,0,0,.06); }
  h1 { margin:0 0 6px; font-size:22px; color:var(--green); }
  p.sub { margin:0 0 8px; color:var(--muted); font-size:14px; line-height:1.5; }
  label { display:block; font-size:14px; font-weight:600; color:#4A5C4A; margin:16px 0 6px; }
  input { width:100%; padding:13px; font-size:16px; border:1px solid var(--border);
          border-radius:10px; background:#fff; }
  input:focus { outline:2px solid var(--green); outline-offset:1px; }
  button { width:100%; margin-top:24px; padding:15px; font-size:16px; font-weight:700; color:#fff;
           background:var(--green); border:0; border-radius:12px; cursor:pointer; }
  button:disabled { background:#A8C49A; cursor:default; }
  .msg { margin-top:16px; font-size:14px; line-height:1.5; padding:12px; border-radius:10px; display:none; }
  .msg.err { display:block; background:#FDECEA; color:var(--red); }
  .msg.ok  { display:block; background:#EAF4E0; color:var(--green); }
  .applink { display:block; margin-top:20px; text-align:center; font-size:14px;
             color:var(--green); font-weight:600; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="card">
  <h1>🌽 Reset your password</h1>
  <p class="sub" id="sub">Choose a new password for your FarmStand account.</p>

  <form id="form">
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" placeholder="At least 6 characters" required>
    <label for="pw2">Confirm new password</label>
    <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter your password" required>
    <button id="submit" type="submit">Update password</button>
  </form>

  <div class="msg" id="msg"></div>
  <a class="applink hide" id="applink" href="#">Open in the FarmStand app instead →</a>
</div>

<script>
  // TODO: replace with your project's URL and anon key. The anon key is designed to be
  // public — it is already shipped inside the mobile app — but never put the service
  // role key here.
  const SUPABASE_URL = "https://kbtryjjihkaafkuvfjbd.supabase.co";
  const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtidHJ5amppaGthYWZrdXZmamJkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMjUxMzAsImV4cCI6MjA5NzYwMTEzMH0.DiWyalde4BhyV8tfULOe2HbBd-D1LAlOmIlKHZU9HZk";

  const form = document.getElementById('form');
  const msg = document.getElementById('msg');
  const sub = document.getElementById('sub');
  const submit = document.getElementById('submit');
  const applink = document.getElementById('applink');

  function show(kind, text) { msg.className = 'msg ' + kind; msg.textContent = text; }
  function fail(text) { form.classList.add('hide'); show('err', text); }

  // Supabase puts recovery tokens in the URL fragment; some email templates use
  // a ?token_hash= query instead, so read both.
  function readParams() {
    const out = {};
    const decode = (s) => decodeURIComponent(s.replace(/\+/g, ' '));
    for (const chunk of [location.hash.slice(1), location.search.slice(1)]) {
      for (const pair of chunk.split('&')) {
        if (!pair) continue;
        const i = pair.indexOf('=');
        if (i === -1) continue;
        out[decode(pair.slice(0, i))] = decode(pair.slice(i + 1));
      }
    }
    return out;
  }

  const params = readParams();
  let accessToken = params.access_token || null;

  // Offer a handoff to the app, preserving the tokens.
  if (location.hash.length > 1) {
    applink.href = 'farmstand://reset-password' + location.hash;
    applink.classList.remove('hide');
  }

  if (params.error_description) {
    fail(params.error_description + ' Request a new reset email from the app and try again.');
  } else if (!accessToken && !params.token_hash) {
    fail('This page needs a valid reset link. Open the most recent "Reset your password" email and tap its link again.');
  }

  // PKCE-style links carry a token_hash that must be exchanged for a session first.
  async function ensureToken() {
    if (accessToken) return true;
    const res = await fetch(SUPABASE_URL + '/auth/v1/verify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: ANON_KEY },
      body: JSON.stringify({ type: params.type || 'recovery', token_hash: params.token_hash }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok || !body.access_token) {
      fail((body.msg || body.error_description || 'This reset link is invalid or has expired.') +
           ' Request a new one from the app.');
      return false;
    }
    accessToken = body.access_token;
    return true;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    if (pw.length < 6) return show('err', 'Password must be at least 6 characters.');
    if (pw !== pw2) return show('err', 'Those passwords do not match.');

    submit.disabled = true;
    submit.textContent = 'Updating…';
    show('ok', 'Updating your password…');

    try {
      if (!(await ensureToken())) return;
      const res = await fetch(SUPABASE_URL + '/auth/v1/user', {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          apikey: ANON_KEY,
          Authorization: 'Bearer ' + accessToken,
        },
        body: JSON.stringify({ password: pw }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.msg || body.error_description || 'Could not update your password.');

      form.classList.add('hide');
      applink.classList.add('hide');
      sub.textContent = '';
      show('ok', '✅ Password updated. You can now sign in to FarmStand with your new password.');
    } catch (err) {
      submit.disabled = false;
      submit.textContent = 'Update password';
      show('err', err.message + ' Reset links expire after an hour — request a new one if needed.');
    }
  });
</script>
</body>
</html>
